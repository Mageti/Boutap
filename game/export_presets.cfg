; Boutap 	les presets d'export Godot.
;
; Ce fichier est versionne, pas genere : la CI s'en sert pour produire les
; quatre cibles de la promesse de livraison (wiki: spec.md 15). Il est donc
; sort de .gitignore -- un preset non versionne est un preset que personne ne
; peut reconstruire.
;
; Les noms ci-dessous sont des identifiants, pas des libelles : la CI appelle
; `godot --export-release <nom>`, et Godot resout le nom, pas l'index. Les
; renommer casse l'export sans message.
;
; R1 : ce fichier ne lit aucune horloge.
;
; Note de format : Godot ecrit ses valeurs chainees vides suivies de deux
; espaces, pour distinguer `""` d'une valeur absente. scripts/check-format.sh
; refuse les espaces en fin de ligne, donc ces deux espaces sont retires ici.
; Le lecteur de Godot s'en fiche : il ignore les espaces de bord.
;
; Les `export_path` commencent par `../` parce que Godot resout un chemin relatif
; depuis le dossier du projet, qui est `game/`. Les artefacts atterrissent donc
; dans `build/` a la racine du depot, ou la CI les retrouve. Godot ne cree pas
; le dossier de sortie : scripts/export.sh le fait avant d'appeler l'export.

[preset.0]
name="linux-x86_64"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features="x86_64"
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../build/linux-x86_64/Boutap.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2
script_encryption_key=""

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false

