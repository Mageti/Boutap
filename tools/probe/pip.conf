# Options de pip pour la sonde. Tenues hors de requirements.txt parce qu'un
# requirements.txt se copie tel quel dans d'autres outils, qui n'y liraient pas
# les options et installeraient avec les valeurs par defaut du systeme.
[global]
no-cache-dir = true
disable-pip-version-check = true
# UnDependances de construction ne sont pas dans requirements.txt : pas de
# --no-binary ici, on veut les roue officielles quand elles existent.
