#
# Boutap — Integration continue.
#
# Cinq idees derriere ce fichier :
#   1. La CI verifie les CINQ regles de code de wiki: spec.md 7.3. Pas
#      « au moins un test qui passe » : les regles elles-memes.
#   2. Linux ET Windows sur chaque PR. Le projet promet la parite stricte ;
#      une CI qui ne teste qu'un seul systeme rend cette promesse unverifiable.
#   3. Aucun test qui ment. Un test instable est marque Skip avec un motif
#      ecrit, jamais « on le desactive ».
#   4. La compilation est verifiee par le chemin documente. Le job « docker »
#      ne rejoue pas la CI a la main : il lance scripts/ci.sh, celui que le
#      README demande au developpeur d'utiliser. Un chemin documente qui casse
#      est un bug, pas une divergence acceptable.
#   5. Tout binaire telecharge est verifie. Un editeur ou un SDK sans somme de
#      controle n'est pas un outil de compilation, c'est une hypothese.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Une PR n'est pas annulee par un nouveau push : ca evite de consommer
# des minutes pour rien quand quelqu'un pousse cinq fois de suite.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0.x'
  GODOT_VERSION: '4.3-stable'
  # Un projet Godot C# exige le binaire MONO et les gabarits MONO. Le binaire
  # standard refuse de compiler, et les gabarits standard ne sont pas
  # installables dans une image mono : l'editeur announce alors « no export
  # template found ».
  #
  # Sommes de controle publiees par Godot dans SHA512-SUMS.txt pour la release
  # 4.3-stable. Il n'existe pas de SHA256-SUMS.txt pour cette release.
  GODOT_EDITOR_SHA512_LINUX: '33d0539bc368ff6f30b5f15d64ec893da8639bd607df83050b5df746c3d30da99238c26dd03a16d7fe31b3a3e58680aeb5545af8784d8ce01edeff07b061ac80'
  GODOT_EDITOR_SHA512_WINDOWS: '6fc1c187d7047d6b0a89e5e4495a63eb70a88209b7f283048f3b3d84d64047bc3addd7cfcb9a67a74441faea19dd8c465456b917cd9c3fc07f2131ee832e6e1e'
  GODOT_TEMPLATES_SHA512: '76796c1df810ecf351b48f303e5525100597be48043d3206bab7c44bd0bc576fb944b4b788619eb9848c31b4245ae0df6f3d665e63d4a083f6dae829919e8e8d'
  # Le dossier de travail des tests, isole pour ne pas salir le depot.
  TEST_TMP: ${{ github.workspace }}/.tmp-tests

jobs:
  # ---------------------------------------------------------------------------
  # 1. Verifications statiques — rapides, sans .NET, sur les deux systemes.
  # ---------------------------------------------------------------------------
  static:
    name: Verifications statiques (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Aucun caractere parasite
        run: python3 scripts/check-mojibake.py

      - name: Regle R1 — aucune horloge murale
        shell: bash
        run: ./scripts/check-no-wallclock.sh

      - name: En-tetes de licence SPDX
        shell: bash
        run: ./scripts/check-licenses.sh

      - name: Format et fins de ligne
        shell: bash
        run: ./scripts/check-format.sh

      - name: JSON valide (schemas et profils)
        shell: bash
        run: |
          for f in schema/*.json profiles/*.json; do
            python3 -c "import json,sys;json.load(open(sys.argv[1],encoding='utf-8'))" "$f" \
              || { echo "::error file=$f::JSON invalide"; exit 1; }
          done

      - name: Les 5 profils livres sont presents
        shell: bash
        run: |
          missing=0
          for p in default-9 popn-keyboard popn-gamepad kboard-9 dev-generic; do
            [ -f "profiles/$p.json" ] || { echo "::error::profil manquant : $p"; missing=1; }
          done
          exit $missing

      - name: Les fixtures sont reproductibles
        # Un fichier binaire genere a la main est un fichier qu'on ne peut plus
        # regenerer. Comparer le contenu a la fabrique est le seul controle qui
        # distingue « le depot est a jour » de « le depot contient du mystere ».
        shell: bash
        run: python3 tools/make-fixtures.py --check

  # ---------------------------------------------------------------------------
  # 2. Compilation et tests .NET — le coeur.
  # ---------------------------------------------------------------------------
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restaurer
        run: dotnet restore

      - name: Construire (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Tests unitaires
        shell: bash
        run: |
          mkdir -p "$TEST_TMP"
          dotnet test --configuration Release --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory "$TEST_TMP" \
            --logger "trx;LogFileName=tests.trx"

      # La mise en forme est uneverification, pas une opinion. Elle ne bloque
      # pas encore : tant que le code n'a pas ete passe une fois en entier, la
      # rendre bloquante ne signalerait qu'un ecart de forme deja connu, et
      # ferait echouer des PR sur un detail cosmétique. Passee une fois, cette
      # etape passe a continuation-on-error: false.
      - name: Mise en forme
        continue-on-error: true
        run: dotnet format Boutap.sln --verify-no-changes --verbosity minimal

      - name: Rapport de couverture
        if: always()
        shell: pwsh
        run: |
          $cov = Get-ChildItem -Recurse -Filter coverage.cobertura.xml "$env:TEST_TMP" | Select-Object -First 1
          if ($cov) {
            [xml]$x = Get-Content $cov.FullName
            $line = $x.coverage.'line-rate'
            "Couverture de lignes : {0:N1} %" -f ($line * 100)
            "Taux au-dessus du seuil de 60 % : $($line -ge 0.6)"
          } else {
            "Aucun rapport de couverture produit."
          }

      - name: Publier le rapport en cas d'echec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: ${{ env.TEST_TMP }}
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Export Godot — verifie que le jeu se construit pour les 4 cibles.
  # ---------------------------------------------------------------------------
  export:
    name: Export Godot (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [static]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Installer Godot ${{ env.GODOT_VERSION }} (mono)
        shell: bash
        env:
          GODOT_RELEASE: ${{ env.GODOT_VERSION }}
          GODOT_TEMPLATES_SHA512: ${{ env.GODOT_TEMPLATES_SHA512 }}
          GODOT_EDITOR_SHA512_LINUX: ${{ env.GODOT_EDITOR_SHA512_LINUX }}
          GODOT_EDITOR_SHA512_WINDOWS: ${{ env.GODOT_EDITOR_SHA512_WINDOWS }}
        run: |
          set -euo pipefail
          # « $GODOT_RELEASE-stable-stable » etait un 404 : la release
          # s'appelle deja « 4.3-stable », le suffixe n'a pas a ete ajoute.
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          if [ "${RUNNER_OS}" = "Linux" ]; then
            asset="Godot_v${GODOT_RELEASE}_mono_linux_x86_64.zip"
            expected="$GODOT_EDITOR_SHA512_LINUX"
            templates_dir="${HOME}/.local/share/godot/export_templates/4.3.stable.mono"
          else
            asset="Godot_v${GODOT_RELEASE}_mono_win64.zip"
            expected="$GODOT_EDITOR_SHA512_WINDOWS"
            templates_dir="${APPDATA}/Godot/export_templates/4.3.stable.mono"
          fi

          curl --fail --location --retry 3 -o "$HOME/editor.zip" "${base}/${asset}"
          printf '%s  %s\n' "$expected" "$HOME/editor.zip" | sha512sum --check --strict -
          unzip -q -o "$HOME/editor.zip" -d "$HOME/godot"
          binary=$(find "$HOME/godot" -type f -name 'Godot*' -size +10M | head -1)
          echo "GODOT_BIN=$binary" >> "$GITHUB_ENV"
          "$binary" --version

          # Les gabarits, eux, sont necessaires des le premier export : sans
          # eux, l'editeur echoue en cherchant un fichier .exe ou .x86_64 a
          # empailleter. Le nom de dossier porte « mono » pour la meme raison
          # que le binaire.
          curl --fail --location --retry 3 -o "$HOME/templates.tpz" \
            "${base}/Godot_v${GODOT_RELEASE}_mono_export_templates.tpz"
          printf '%s  %s\n' "$GODOT_TEMPLATES_SHA512" "$HOME/templates.tpz" | sha512sum --check --strict -
          mkdir -p "$templates_dir"
          unzip -q -o "$HOME/templates.tpz" -d "$HOME/templates"
          cp -r "$HOME/templates/templates/." "$templates_dir/"

      - name: Compiler la coque Godot (Debug)
        # L'editeur ne trouve pas l'assembly d'un projet compile uniquement en
        # Release : il affiche « Cannot instantiate C# script because the
        # associated class could not be found », qui parle de runtime et fait
        # chercher le probleme au mauvais endroit.
        run: dotnet build game/Boutap.Shell.csproj --configuration Debug

      - name: Exporter les cibles
        shell: bash
        run: |
          set -euo pipefail
          for preset in linux-x86_64 linux-arm64 windows-x86_64 portable-windows; do
            # Godot ne cree pas le dossier de sortie et ne dit pas quel preset
            # est en cause quand il manque.
            mkdir -p "build/$preset"
            # --path game : le projet Godot est dans game/. A la racine, il
            # n'y a qu'une seule solution, pour que « dotnet build » sans
            # argument fonctionne des deux cotes.
            "$GODOT_BIN" --headless --path game --export-release "$preset" "../build/$preset" \
              || { echo "::error::export '$preset' en echec"; exit 1; }
          done

      - name: Taille des artefacts
        shell: bash
        run: |
          for d in build/*/; do
            [ -d "$d" ] || continue
            size=$(du -sh "$d" | cut -f1)
            echo "$d : $size"
          done

      - name: Publier les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: exports-${{ matrix.os }}
          path: build/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 4. Audit des assets — licences, marques, fichiers de jeu tiers.
  # ---------------------------------------------------------------------------
  assets:
    name: Audit des assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurer et construire
        run: |
          dotnet restore
          dotnet build src/Boutap.Tools/Boutap.Tools.csproj --configuration Release

      - name: Audit du depot
        shell: bash
        run: dotnet run --project src/Boutap.Tools --configuration Release --no-build -- audit --warn .

      - name: Registre des assets tiers complet
        shell: bash
        run: |
          set -euo pipefail
          for d in assets fonts packs; do
            [ -d "$d" ] || continue
            for f in "$d"/*; do
              [ -e "$f" ] || continue
              name=$(basename "$f")
              grep -q "$name" THIRD_PARTY_ASSETS.md \
                || { echo "::error file=$f::absent de THIRD_PARTY_ASSETS.md"; exit 1; }
            done
          done
          echo "Registre complet."

  # ---------------------------------------------------------------------------
  # 5. Le chemin de compilation documente — le meme que celui du developpeur.
  # ---------------------------------------------------------------------------
  docker:
    name: Compilation dans Docker
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4

      # Ce job existe pour une raison precise : les scripts de scripts/*.sh
      # sont la maniere dont le projet promet de se compiler. S'ils cassent,
      # ce n'est pas « la CI a un souci », c'est le produit qui est casse pour
      # quelqu'un qui n'a pas .NET d'installe. On lance donc le script, pas une
      # reimplementation de lui.
      - name: Tout compiler et tester dans les conteneurs
        run: ./scripts/ci.sh

      - name: Publier les exports produits par le conteneur
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exports-docker
          path: build/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 6. Le controle final, qui doit etre vert pour merger.
  # ---------------------------------------------------------------------------
  gate:
    name: Porte de fusion
    runs-on: ubuntu-latest
    if: always()
    needs: [static, test, export, assets, docker]
    steps:
      - name: Verifier tous les jobs
        shell: bash
        run: |
          set -euo pipefail
          echo "static   : ${{ needs.static.result }}"
          echo "test     : ${{ needs.test.result }}"
          echo "export   : ${{ needs.export.result }}"
          echo "assets   : ${{ needs.assets.result }}"
          echo "docker   : ${{ needs.docker.result }}"
          for job in static test export assets docker; do
            if [ "${{ needs.$job.result }}" != "success" ]; then
              echo "::error::le job '$job' n'a pas reussi"
              exit 1
            fi
          done
          echo "Porte ouverte."
